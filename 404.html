<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>

    <style media="screen">
      body { background: #FFF9EC; color: #3B160F; font-family: Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
      #message { background: white; max-width: 360px; margin: 100px auto 16px; padding: 32px 24px 16px; border-radius: 8px; border: 1px solid #E8DCC5; }
      #message h3 { color: #705B4D; font-weight: normal; font-size: 16px; margin: 16px 0 12px; }
      #message h2 { color: #651B24; font-weight: bold; font-size: 18px; margin: 0 0 8px; }
      #message h1 { font-size: 22px; font-weight: 600; color: #3B160F; margin: 0 0 16px;}
      #message p { line-height: 140%; margin: 16px 0 24px; font-size: 14px; color: #3B160F; }
      #message a { display: block; text-align: center; background: #651B24; text-transform: uppercase; text-decoration: none; color: #FFF9EC; padding: 14px; border-radius: 6px; font-weight: 600; }
      #message a:hover { background: #D4A52C; color: #3B160F; }
      #message, #message a { box-shadow: 0 2px 8px rgba(59, 22, 15, 0.08); }
      #load { color: #705B4D; text-align: center; font-size: 13px; }
      @media (max-width: 600px) {
        body, #message { margin-top: 0; background: #FFF9EC; box-shadow: none; }
        body { border-top: 16px solid #651B24; }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <h2>404</h2>
      <h1>Page Not Found</h1>
      <p>The specified file was not found on this website. Please check the URL for mistakes and try again.</p>
      <h3>Why am I seeing this?</h3>
      <p>This page was generated by the Firebase Command-Line Interface. To modify it, edit the <code>404.html</code> file in your project's configured <code>public</code> directory.</p>
    </div>
  </body>
</html>
